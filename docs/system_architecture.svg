<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1350" viewBox="0 0 1700 1350"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#42688f"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fb"/><g font-family="Microsoft YaHei, sans-serif"><text x="50" y="64" font-size="34" fill="#152b48" font-weight="700">系统框图：ESP32-S3 + 4G DTU 定位邮件</text><text x="50" y="101" font-size="19" fill="#53647b" font-weight="400">依据当前工程源码 / 2026-10-12 · 蓝色区域为 ESP32 软件，右侧为外部设备与服务</text><rect x="40" y="130" width="1190" height="1140" rx="14" fill="#e9f1fc" stroke="#c8d5e5" stroke-width="2"/><text x="58" y="166" font-size="22" fill="#152b48" font-weight="700">ESP32-S3 / ESP-IDF / FreeRTOS</text><rect x="75" y="195" width="330" height="135" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="93" y="231" font-size="22" fill="#152b48" font-weight="700">main：启动入口</text><text x="93" y="265" font-size="18" fill="#20344e" font-weight="400">app_service_start()</text><text x="93" y="294" font-size="18" fill="#20344e" font-weight="400">app_console_start()</text><rect x="445" y="195" width="360" height="135" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="463" y="231" font-size="22" fill="#152b48" font-weight="700">App / Boot：启动配置</text><text x="463" y="265" font-size="18" fill="#20344e" font-weight="400">编译配置 → 收发邮箱与授权码</text><text x="463" y="294" font-size="18" fill="#20344e" font-weight="400">当前：上电单封 / 时区 UTC+8</text><rect x="845" y="195" width="350" height="135" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="863" y="231" font-size="22" fill="#152b48" font-weight="700">App / Console：调试入口</text><text x="863" y="265" font-size="18" fill="#20344e" font-weight="400">UART0 REPL / 状态与手动命令</text><text x="863" y="294" font-size="18" fill="#20344e" font-weight="400">只调用 Service，不操作 UART1</text><rect x="250" y="395" width="775" height="165" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="268" y="431" font-size="22" fill="#152b48" font-weight="700">App / Service：业务调度中心</text><text x="268" y="465" font-size="18" fill="#20344e" font-weight="400">容量 1 的工作队列 + busy 状态 + 互斥锁</text><text x="268" y="494" font-size="18" fill="#20344e" font-weight="400">唯一 dtu_worker：16 KiB 栈 / 优先级 5</text><text x="268" y="523" font-size="18" fill="#20344e" font-weight="400">串行执行：校时 → 查询定位 → 组正文 → 邮件传输</text><polyline points="240,330 240,365 400,365 400,395" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><polyline points="625,330 625,395" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1020,330 1020,365 880,365 880,395" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="635" width="325" height="170" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="93" y="671" font-size="22" fill="#152b48" font-weight="700">Middlewares / TIME</text><text x="93" y="705" font-size="18" fill="#20344e" font-weight="400">nettime 查询与日期校验</text><text x="93" y="734" font-size="18" fill="#20344e" font-weight="400">时区偏移 → UTC Unix 时间</text><text x="93" y="763" font-size="18" fill="#20344e" font-weight="400">设置系统时钟供 TLS / Date 使用</text><rect x="445" y="635" width="360" height="170" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="463" y="671" font-size="22" fill="#152b48" font-weight="700">Middlewares / LOCATION</text><text x="463" y="705" font-size="18" fill="#20344e" font-weight="400">LBS / GNSS 查询与应答解析</text><text x="463" y="734" font-size="18" fill="#20344e" font-weight="400">状态、经纬度、耗时、错误码</text><text x="463" y="763" font-size="18" fill="#20344e" font-weight="400">异常 / 双零坐标 → 无有效位置</text><rect x="850" y="635" width="345" height="170" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="868" y="671" font-size="22" fill="#152b48" font-weight="700">App / Message</text><text x="868" y="705" font-size="18" fill="#20344e" font-weight="400">location_mail_body()</text><text x="868" y="734" font-size="18" fill="#20344e" font-weight="400">基础正文 + 本次位置 / 失败原因</text><text x="868" y="763" font-size="18" fill="#20344e" font-weight="400">查询完成 UTC 时间；不复用旧坐标</text><polyline points="400,560 400,595 240,595 240,635" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><polyline points="625,560 625,635" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><polyline points="805,720 850,720" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="885" width="750" height="180" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="463" y="921" font-size="22" fill="#152b48" font-weight="700">Middlewares / MAIL：端到端邮件协议</text><text x="463" y="955" font-size="18" fill="#20344e" font-weight="400">mail_link：DTU 重启 / 通道检查 / MIME / mbedTLS</text><text x="463" y="984" font-size="18" fill="#20344e" font-weight="400">mail_protocol：SMTP 应答校验与 AUTH LOGIN / DATA</text><text x="463" y="1013" font-size="18" fill="#20344e" font-weight="400">TLS 在 ESP32 执行；证书链 + 主机名 + 有效期校验</text><polyline points="1020,805 1020,885" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="1110" width="1120" height="125" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="93" y="1146" font-size="22" fill="#152b48" font-weight="700">BSP / DTU：UART1 驱动与帧完整性</text><text x="93" y="1180" font-size="18" fill="#20344e" font-weight="400">115200 / 8N1 / 无硬件流控 · GPIO4 TX → DTU RX · GPIO5 RX ← DTU TX</text><text x="93" y="1209" font-size="18" fill="#20344e" font-weight="400">RX 32 KiB / TX 2 KiB / 事件队列 · ASCII 命令读行 + TLS 二进制收发</text><polyline points="240,805 240,1110" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><polyline points="625,805 625,845 420,845 420,1110" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><polyline points="820,1065 820,1110" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="1280" y="195" width="370" height="160" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="1298" y="231" font-size="22" fill="#152b48" font-weight="700">电脑（可选）</text><text x="1298" y="265" font-size="18" fill="#20344e" font-weight="400">UART0：调试命令 / 日志</text><text x="1298" y="294" font-size="18" fill="#20344e" font-weight="400">烧录与调试阶段使用</text><text x="1298" y="323" font-size="18" fill="#20344e" font-weight="400">独立运行不需要电脑提供时间</text><polyline points="1280,275 1245,275 1245,365 1100,365 1100,330" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="1280" y="470" width="370" height="200" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="1298" y="506" font-size="22" fill="#152b48" font-weight="700">4G DTU 模块</text><text x="1298" y="540" font-size="18" fill="#20344e" font-weight="400">厂商固件：时间 / LBS / GNSS接口</text><text x="1298" y="569" font-size="18" fill="#20344e" font-weight="400">TCP 通道 → smtp.qq.com:465</text><text x="1298" y="598" font-size="18" fill="#20344e" font-weight="400">串口透明传输 TLS 字节</text><text x="1298" y="627" font-size="18" fill="#20344e" font-weight="400">联网与定位能力依赖实际模块</text><polyline points="1195,1170 1250,1170 1250,590 1280,590" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><text x="1280" y="712" font-size="17" fill="#42688f" font-weight="400">UART1 / 3.3 V TTL / 共地</text><rect x="1280" y="735" width="370" height="140" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="1298" y="771" font-size="22" fill="#152b48" font-weight="700">运营商网络 / Internet</text><text x="1298" y="805" font-size="18" fill="#20344e" font-weight="400">4G 接入与 TCP 字节传输</text><text x="1298" y="834" font-size="18" fill="#20344e" font-weight="400">LBS 所需服务依赖 DTU 实现</text><polyline points="1460,670 1460,735" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="1280" y="940" width="370" height="140" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="1298" y="976" font-size="22" fill="#152b48" font-weight="700">QQ SMTP 邮件服务器</text><text x="1298" y="1010" font-size="18" fill="#20344e" font-weight="400">TLS 对端 / 授权码认证</text><text x="1298" y="1039" font-size="18" fill="#20344e" font-weight="400">DATA 最终 250 → 已接受提交</text><polyline points="1460,875 1460,940" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="1280" y="1145" width="370" height="125" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="1298" y="1181" font-size="22" fill="#152b48" font-weight="700">收件人邮箱</text><text x="1298" y="1215" font-size="18" fill="#20344e" font-weight="400">接收包含定位状态的测试邮件</text><text x="1298" y="1244" font-size="18" fill="#20344e" font-weight="400">服务器接受不等于已进入收件箱</text><polyline points="1460,1080 1460,1145" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="1313" font-size="20" fill="#20344e" font-weight="400">当前源码未包含传感器采集、跌倒算法、短信、显示或自建云函数；本图只表示已实现链路。</text></g></svg>