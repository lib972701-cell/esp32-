<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#42688f"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fb"/><g font-family="Microsoft YaHei, sans-serif"><text x="50" y="64" font-size="34" fill="#152b48" font-weight="700">工作流程：一次独立上电邮件任务</text><text x="50" y="101" font-size="19" fill="#53647b" font-weight="400">自动启动默认查询 LBS；GNSS 是手动选择的查询分支 · 时间为代码中的等待 / 超时边界</text><rect x="70" y="140" width="1010" height="94" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="88" y="176" font-size="22" fill="#152b48" font-weight="700">① 上电与应用启动</text><text x="88" y="210" font-size="18" fill="#20344e" font-weight="400">app_main → Service → Console；加载编译配置，创建唯一 worker</text><polyline points="575,234 575,259" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="259" width="1010" height="94" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="88" y="295" font-size="22" fill="#152b48" font-weight="700">② 配置校验与 UART1 初始化</text><text x="88" y="329" font-size="18" fill="#20344e" font-weight="400">收发邮箱 / 授权码校验；初始化后等待 DTU 启动 20 秒</text><polyline points="575,353 575,378" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="378" width="1010" height="94" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="88" y="414" font-size="22" fill="#152b48" font-weight="700">③ 查询 DTU 网络时间并设置 ESP32 时钟</text><text x="88" y="448" font-size="18" fill="#20344e" font-weight="400">config,get,nettime；单次最多 5 秒，总预算 90 秒；UTC+8 → UTC</text><polyline points="575,472 575,497" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="497" width="1010" height="94" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="88" y="533" font-size="22" fill="#152b48" font-weight="700">④ 查询本次位置</text><text x="88" y="567" font-size="18" fill="#20344e" font-weight="400">自动：LBS 最多 65 秒；手动 GNSS：最多 5 秒；校验帧与坐标</text><polyline points="575,591 575,616" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="616" width="1010" height="94" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="88" y="652" font-size="22" fill="#152b48" font-weight="700">⑤ 生成定位邮件正文</text><text x="88" y="686" font-size="18" fill="#20344e" font-weight="400">有效：WGS84 经纬度 + 来源；无效：状态说明；均附查询完成时间</text><polyline points="575,710 575,735" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="735" width="1010" height="94" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="88" y="771" font-size="22" fill="#152b48" font-weight="700">⑥ 重启 DTU，准备新的 TCP 会话</text><text x="88" y="805" font-size="18" fill="#20344e" font-weight="400">等待 20 秒；核验 smtp.qq.com:465 通道；TCP 就绪等待最多 90 秒</text><polyline points="575,829 575,854" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="854" width="1010" height="94" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="88" y="890" font-size="22" fill="#152b48" font-weight="700">⑦ ESP32 与 QQ 服务器完成 TLS 握手</text><text x="88" y="924" font-size="18" fill="#20344e" font-weight="400">mbedTLS + 证书包；校验证书 / smtp.qq.com / 时间；握手最多 60 秒</text><polyline points="575,948 575,973" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="973" width="1010" height="94" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="88" y="1009" font-size="22" fill="#152b48" font-weight="700">⑧ 编码 MIME 并执行 SMTP 提交</text><text x="88" y="1043" font-size="18" fill="#20344e" font-weight="400">EHLO → AUTH LOGIN → MAIL FROM → RCPT TO → DATA → 正文</text><polyline points="575,1067 575,1092" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="1092" width="1010" height="94" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="88" y="1128" font-size="22" fill="#152b48" font-weight="700">⑨ 记录结果，清理临时数据，回到等待任务</text><text x="88" y="1162" font-size="18" fill="#20344e" font-weight="400">DATA_ACCEPTED / REJECTED / FAILED / UNKNOWN_NO_RETRY；不自动补发</text><rect x="1140" y="245" width="400" height="175" rx="14" fill="#fff0ef" stroke="#e4b1ad" stroke-width="2"/><text x="1158" y="281" font-size="22" fill="#152b48" font-weight="700">停止发送</text><text x="1158" y="315" font-size="18" fill="#20344e" font-weight="400">配置 / UART / 校时失败</text><text x="1158" y="344" font-size="18" fill="#20344e" font-weight="400">TLS 校验或握手失败</text><text x="1158" y="373" font-size="18" fill="#20344e" font-weight="400">记录失败结果，释放 busy</text><polyline points="1080,300 1140,300" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1080,420 1110,420 1110,345 1140,345" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1080,902 1110,902 1110,380 1140,380" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="1140" y="500" width="400" height="150" rx="14" fill="#fff8e6" stroke="#e0ca8a" stroke-width="2"/><text x="1158" y="536" font-size="22" fill="#152b48" font-weight="700">定位失败仍继续</text><text x="1158" y="570" font-size="18" fill="#20344e" font-weight="400">NO_FIX / TIMEOUT / 错误等</text><text x="1158" y="599" font-size="18" fill="#20344e" font-weight="400">写明“无有效位置”</text><text x="1158" y="628" font-size="18" fill="#20344e" font-weight="400">不回退使用旧坐标</text><polyline points="1080,544 1140,544" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><rect x="1140" y="985" width="400" height="180" rx="14" fill="#eaf7ef" stroke="#b0d5be" stroke-width="2"/><text x="1158" y="1021" font-size="22" fill="#152b48" font-weight="700">提交结果必须区分</text><text x="1158" y="1055" font-size="18" fill="#20344e" font-weight="400">最终 250：服务器已接受</text><text x="1158" y="1084" font-size="18" fill="#20344e" font-weight="400">明确 4xx / 5xx：被拒绝</text><text x="1158" y="1113" font-size="18" fill="#20344e" font-weight="400">DATA 后应答丢失：结果未知</text><text x="1158" y="1142" font-size="18" fill="#20344e" font-weight="400">未知时不自动重发</text><polyline points="1080,1139 1140,1139" fill="none" stroke="#42688f" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="1249" font-size="19" fill="#20344e" font-weight="400">每次上电发一封 ≠ 周期发送；复位会启动新任务。各步骤可提前返回，图中时间不能当作实际发信耗时。</text></g></svg>